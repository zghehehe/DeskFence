name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链 pin 在 1.97.0(2026-09-11):CI 用 @stable 曾因 runner 比本地新
      # (1.98 新 lint chunks_exact_to_as_chunks)四处红灯。不用 dtolnay action
      # (其版本分支止于 1.83,引用不可靠),显式 rustup 安装并带上 rustfmt+
      # clippy 组件——rust-toolchain.toml 触发的懒安装走 default profile
      # 不含这两个组件,fmt/clippy 首步即挂(2026-09-11 实锤)。与
      # rust-toolchain.toml 双保险,升级两端同步。
      - name: Install pinned toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2

      # 2026-09-11 全库格式化后开启;本地提交前先 cargo fmt --check
      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      # clippy 严格门禁(2026-09-09:存量 71 条风格警告已在 1f59b84..305e72b
      # 分批清零,任何新警告直接红灯)。--all-targets 把测试代码也纳入门禁
      # (2026-09-11 本地全绿后加入)
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
