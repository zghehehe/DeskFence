name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check single-file binary (static CRT, no VC runtime import)
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/deskfence.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCRUNTIME140") {
            Write-Error "exe still imports VCRUNTIME140.dll - crt-static is not in effect"
            exit 1
          }
          Write-Output "single-file check ok"

      - name: Hash
        shell: pwsh
        run: (Get-FileHash target/release/deskfence.exe -Algorithm SHA256).Hash |
          Out-File -Encoding ascii deskfence.exe.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Release 正文 = 同步提交信息:main 上每个发布提交的 message
          # 就是该版本的全量更新日志,发版那一刻随 Release 一起创建,
          # 不再依赖 generate_release_notes(无 PR 的直推仓库只会生成
          # 一行 Full Changelog 链接)。
          body: ${{ github.event.head_commit.message }}
          files: |
            target/release/deskfence.exe
            deskfence.exe.sha256
