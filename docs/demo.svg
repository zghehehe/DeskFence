<svg viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="桌面图标自动归入栅栏的演示动画">
  <style>
    @keyframes scatteredIO{0%,22%{opacity:1}32%,94%{opacity:0}100%{opacity:1}}
    @keyframes fenceIO{0%,34%{opacity:0}46%,86%{opacity:1}94%,100%{opacity:0}}
    @keyframes fenceIO2{0%,40%{opacity:0}52%,86%{opacity:1}94%,100%{opacity:0}}
    @keyframes fenceIO3{0%,46%{opacity:0}58%,86%{opacity:1}94%,100%{opacity:0}}
    .scattered{animation:scatteredIO 7s ease-in-out infinite}
    .f1{animation:fenceIO 7s ease-in-out infinite}
    .f2{animation:fenceIO2 7s ease-in-out infinite}
    .f3{animation:fenceIO3 7s ease-in-out infinite}
    text{font-family:sans-serif}
  </style>
  <rect width="880" height="460" fill="#8ec9f0"/>
  <path d="M0 340 Q220 260 440 330 T880 310 V460 H0 Z" fill="#7ab2dd"/>
  <path d="M0 390 Q260 330 520 380 T880 370 V460 H0 Z" fill="#6aa3d2"/>
  <rect x="0" y="432" width="880" height="28" fill="#ffffff" opacity=".82"/>
  <rect x="12" y="438" width="16" height="16" rx="3" fill="#0078d4"/>
  <circle cx="440" cy="446" r="3" fill="#0071e3"/>
  <g opacity=".5"><rect x="820" y="440" width="18" height="12" rx="2" fill="#555"/></g>
  <!-- 原生散乱图标(渐隐) -->
  <g class="scattered">
    <g><rect x="716" y="56" width="44" height="44" rx="8" fill="#ffd34d"/><text x="738" y="118" font-size="11" text-anchor="middle" fill="#333">报告.docx</text></g>
    <g><rect x="800" y="66" width="44" height="44" rx="8" fill="#7ee08a"/><text x="822" y="128" font-size="11" text-anchor="middle" fill="#333">预算.xlsx</text></g>
    <g><rect x="716" y="168" width="44" height="44" rx="8" fill="#f28b6b"/><text x="738" y="230" font-size="11" text-anchor="middle" fill="#333">照片.jpg</text></g>
    <g><rect x="800" y="178" width="44" height="44" rx="8" fill="#9d8cf0"/><text x="822" y="240" font-size="11" text-anchor="middle" fill="#333">工具.exe</text></g>
  </g>
  <!-- 三个栅栏(渐显) -->
  <g>
    <rect x="46" y="46" width="180" height="200" rx="12" fill="#ffffff" opacity="0" class="f1"/>
    <rect x="46" y="46" width="180" height="200" rx="12" fill="none" stroke="#9ab8d8" stroke-width="1.5" opacity="0" class="f1"/>
    <text x="136" y="72" font-size="13" font-weight="600" fill="#33506e" text-anchor="middle" opacity="0" class="f1">文档</text>
    <g opacity="0" class="f1"><rect x="72" y="92" width="40" height="40" rx="8" fill="#ffd34d"/><text x="92" y="150" font-size="10" text-anchor="middle" fill="#333">报告.docx</text></g>
    <g opacity="0" class="f1"><rect x="152" y="92" width="40" height="40" rx="8" fill="#7ee08a"/><text x="172" y="150" font-size="10" text-anchor="middle" fill="#333">预算.xlsx</text></g>
    <g opacity="0" class="f1"><rect x="72" y="168" width="40" height="40" rx="8" fill="#6bc1e8"/><text x="92" y="226" font-size="10" text-anchor="middle" fill="#333">笔记.txt</text></g>

    <rect x="290" y="46" width="180" height="200" rx="12" fill="#ffffff" opacity="0" class="f2"/>
    <rect x="290" y="46" width="180" height="200" rx="12" fill="none" stroke="#9ab8d8" stroke-width="1.5" opacity="0" class="f2"/>
    <text x="380" y="72" font-size="13" font-weight="600" fill="#33506e" text-anchor="middle" opacity="0" class="f2">图片</text>
    <g opacity="0" class="f2"><rect x="316" y="92" width="40" height="40" rx="8" fill="#f28b6b"/><text x="336" y="150" font-size="10" text-anchor="middle" fill="#333">照片.jpg</text></g>
    <g opacity="0" class="f2"><rect x="396" y="92" width="40" height="40" rx="8" fill="#f2b6d8"/><text x="416" y="150" font-size="10" text-anchor="middle" fill="#333">设计.png</text></g>

    <rect x="534" y="46" width="180" height="200" rx="12" fill="#ffffff" opacity="0" class="f3"/>
    <rect x="534" y="46" width="180" height="200" rx="12" fill="none" stroke="#9ab8d8" stroke-width="1.5" opacity="0" class="f3"/>
    <text x="624" y="72" font-size="13" font-weight="600" fill="#33506e" text-anchor="middle" opacity="0" class="f3">软件</text>
    <g opacity="0" class="f3"><rect x="560" y="92" width="40" height="40" rx="8" fill="#9d8cf0"/><text x="580" y="150" font-size="10" text-anchor="middle" fill="#333">工具.exe</text></g>
    <g opacity="0" class="f3"><rect x="640" y="92" width="40" height="40" rx="8" fill="#54c7ec"/><text x="660" y="150" font-size="10" text-anchor="middle" fill="#333">浏览器</text></g>
  </g>
  <g>
    <rect x="240" y="300" width="400" height="44" rx="22" fill="#1d1d1f" opacity=".82"/>
    <text x="440" y="328" font-size="16" fill="#fff" text-anchor="middle">启动 DeskFence → 图标自动归类入栅栏</text>
  </g>
</svg>
